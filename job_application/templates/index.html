<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Form</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    >
</head>

<body>

<div class="container">

    <h1 class="mt-4 mb-4">Job Application Form</h1>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="first_name" class="form-label">
                First Name:
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label for="last_name" class="form-label">
                Last Name:
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label for="email" class="form-label">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">
            <label for="date" class="form-label">
                Available start date:
            </label>

            <input
                type="date"
                id="date"
                name="date"
                class="form-control"
                required
            >
        </div>


        <div class="mb-3">

            <label class="form-label">
                Current occupation:
            </label>

            <div id="occupation">

                <div class="form-check">
                    <input
                        type="radio"
                        id="employed"
                        name="occupation"
                        value="Employed"
                        class="form-check-input"
                        required
                    >

                    <label
                        for="employed"
                        class="form-check-label"
                    >
                        Employed
                    </label>
                </div>


                <div class="form-check">
                    <input
                        type="radio"
                        id="unemployed"
                        name="occupation"
                        value="Unemployed"
                        class="form-check-input"
                    >

                    <label
                        for="unemployed"
                        class="form-check-label"
                    >
                        Unemployed
                    </label>
                </div>


                <div class="form-check">
                    <input
                        type="radio"
                        id="self-employed"
                        name="occupation"
                        value="Self-Employed"
                        class="form-check-input"
                    >

                    <label
                        for="self-employed"
                        class="form-check-label"
                    >
                        Self-Employed
                    </label>
                </div>


                <div class="form-check">
                    <input
                        type="radio"
                        id="student"
                        name="occupation"
                        value="Student"
                        class="form-check-input"
                    >

                    <label
                        for="student"
                        class="form-check-label"
                    >
                        Student
                    </label>
                </div>

            </div>
        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Submit
        </button>

    </form>

        {% if messages %}
        <div class="alert alert-success mt-3">
            {% for message in messages %}
            {{ message }}
            {% endfor %}
        </div>
        {% endif %}

</div>


<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>

</body>
</html>
